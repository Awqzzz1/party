<script>
const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyuDz6rGhG3_0QkbC5hOzu8--HW3REGaxpTwlC7tFGFjdGhCnM4RoS7ldSoe6lEZiLW/exec";

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("form");
    const success = document.getElementById("success");

    if (!form) {
        console.error("FEHLER: Formular #form wurde nicht gefunden!");
        return;
    }

    form.addEventListener("submit", function (event) {

        event.preventDefault();

        const nameInput = document.getElementById("name");
        const contactInput = document.getElementById("contact");
        const button = form.querySelector("button");

        const name = nameInput.value.trim();
        const contact = contactInput.value.trim();

        if (name.length < 2) {
            alert("Bitte gib deinen vollständigen Namen ein.");
            nameInput.focus();
            return;
        }

        button.disabled = true;
        button.textContent = "ANMELDUNG WIRD GESENDET...";

        const anmeldung = {
            name: name,
            contact: contact
        };

        console.log("Sende Anmeldung:", anmeldung);

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(anmeldung)
        })
        .then(function () {

            console.log("Anmeldung wurde an Google gesendet.");

            form.reset();

            success.hidden = false;
            success.textContent =
                "✓ Anmeldung erfolgreich! Du stehst auf der Gästeliste.";

            button.disabled = false;
            button.textContent =
                "AUF DIE GÄSTELISTE →";

        })
        .catch(function (error) {

            console.error(
                "FEHLER BEI DER ANMELDUNG:",
                error
            );

            success.hidden = false;
            success.textContent =
                "⚠ Anmeldung konnte nicht gesendet werden.";

            button.disabled = false;
            button.textContent =
                "ERNEUT VERSUCHEN →";

        });

    });

});
</script>
