<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyuDz6rGhG3_0QkbC5hOzu8--HW3REGaxpTwlC7tFGFjdGhCnM4RoS7ldSoe6lEZiLW/exec";

const form = document.getElementById("form");
const success = document.getElementById("success");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const button = form.querySelector("button");

    if (name.length < 2) {
        alert("Bitte gib deinen Namen ein.");
        return;
    }

    button.disabled = true;
    button.textContent = "ANMELDUNG WIRD GESENDET...";

    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
            name: name,
            contact: contact
        })
    })
    .then(function() {

        form.reset();

        success.hidden = false;
        success.textContent =
            "✓ Du bist angemeldet! Wir sehen uns bei Viki & Sandra.";

        button.disabled = false;
        button.textContent = "AUF DIE GÄSTELISTE →";

    })
    .catch(function(error) {

        console.error(error);

        success.hidden = false;
        success.textContent =
            "⚠ Es gab einen Fehler. Bitte versuche es erneut.";

        button.disabled = false;
        button.textContent = "AUF DIE GÄSTELISTE →";
    });
});
</script>
